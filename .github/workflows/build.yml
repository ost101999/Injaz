name: Build & Release Electron App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
          - os: macos-latest
            platform_flag: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Compute Version
        id: version
        shell: bash
        run: |
          VERSION="$(node electron/build-with-version.cjs --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Injaz v$VERSION on ${{ matrix.os }}"

      - name: Build Distributables
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          INJAZ_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          npm run compile:electron
          node electron/build-with-version.cjs ${{ matrix.platform_flag }} --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute Version
        id: version
        run: |
          VERSION="$(node electron/build-with-version.cjs --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" artifacts/* \
              --title "Injaz $TAG" \
              --notes "إصدار تلقائي رقم $VERSION لويندوز وماك." \
              --latest
          fi
